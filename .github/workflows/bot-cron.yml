name: GADAP Hub WhatsApp Cron Bot

on:
  schedule:
    # Executa a cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite disparo manual via painel do GitHub Actions

concurrency:
  group: gadap-whatsapp-bot
  cancel-in-progress: false # Evita que duas instâncias concorrentes alterem as chaves da sessão ao mesmo tempo

jobs:
  run-bot:
    name: Executar Sincronização e Relatórios
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Timeout preventivo geral do Job

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Executar Bot Efêmero
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OBRA_GROUP_ID: ${{ secrets.OBRA_GROUP_ID }}
          OBRA_ID: ${{ secrets.OBRA_ID || 'obra_principal' }}
          TZ: 'America/Sao_Paulo'
        run: node dist/index.js
