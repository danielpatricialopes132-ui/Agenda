name: GADAP Hub WhatsApp Cron Bot

on:
  schedule:
    # Executa a cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite disparo manual via painel do GitHub Actions

# Evita execuções concorrentes simultâneas no runner efêmero
concurrency:
  group: gadap-whatsapp-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Sincronizar Mensagens e Disparar Relatorios
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Timeout preventivo geral do job

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificacao Estrita de Tipos (Quality Gate)
        run: npx tsc --noEmit

      - name: Compilar TypeScript
        run: npm run build

      - name: Executar Trabalhador Efemero (Bot)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OBRA_ID: ${{ secrets.OBRA_ID || 'obra_principal' }}
          TZ: 'America/Sao_Paulo'
        run: node dist/bot.js
